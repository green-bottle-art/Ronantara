<html>

<head>
    <title> Upload - RONANTARA </title>

    <link rel="stylesheet" type="text/css" href="asset/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="asset/css/style.css">
    <link rel="stylesheet" type="text/css" href="asset/css/style-ronantara.css">
</head>

<body>
    <div class="header">
        <div class="judul">
            <h1>
                RONANTARA
            </h1>
        </div>
        <!---menu-->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <button class="hamburger-btn" onclick="toggleMenu()" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-list"
                    viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
                </svg>
            </button>
            <div class="col">
                <div class="nav-left">

                    <div class="nav-links" id="navLinks">
                        <a href="index.html">Beranda</a>
                        <a href="upload.html">Unggah</a>
                        <a href="jelajahi.html">Jelajahi</a>
                    </div>
                </div>

            </div>
            <div class="nav-right">
                <input type="text" class="search-bar" placeholder="Cari" onclick="window.location.href='jelajahi.html'"
                    readonly style="cursor:pointer"> <a class="btn-light" href="profil.html" title="Profil Saya">
                    <img src="https://i.pinimg.com/736x/ec/1b/1e/ec1b1e453ce29b300812a379e14f7a30.jpg"
                        class="rounded-circle avatar-nav">

                </a>
            </div>

            <div class="clear-float"></div>
        </nav>
    </div>
    <div class="container mt-4">

        <div class="d-flex align-items-center gap-2 mb-4">
            <img src="https://i.pinimg.com/736x/ad/cb/ed/adcbed4eca9b815328f3585d547c5d76.jpg"
                class="rounded-circle avatar-circle" id="previewAvatar">
            <a href="#" class="btn btn-outline ms-auto"
                onclick="document.getElementById('inputFoto').click(); return false;">Edit</a>
            <input type="file" id="inputFoto" accept="image/*" style="display:none" onchange="previewFoto(event)">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Nama</label>
            <input type="text" class="form-control" placeholder="Masukkan nama kamu" value="TillTheEnd">
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Bio</label>
            <textarea class="form-control" rows="4" placeholder="Masukkan bio kamu">Not your universe</textarea>
        </div>

        <hr>
        <h5 class="fw-bold mt-4 mb-3">Manajemen Akun</h5>
        <div class="mb-3">
            <label class="form-label fw bold">Email</label>
            <input type="email" class="form-control" placeholder="Masukkan email kamu" value="Tillbunny@gmail.com" />
        </div>
        <div class="mb-4">
            <label class="form-label fw bold">Sandi</label>
            <input type="password" class="form-control" placeholder="kosongkan jika tidak ingin mengubah" />

        </div>
        <div class="d-flex justify-content-center gap-3 mb-5">
            <button class="btn btn-outline-secondary px-4" type="reset">Reset</button>
            <button class="btn btn-outline-secondary px-4" type="submit">Simpan</button>
        </div>
    </div>
    
        <footer class="footer">
            <p>©2026 Ronantara by Kokok Mania</p>
        </footer>
        <script type="text/javascript" src="asset/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
        <script>
    function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('nav-open')
    }
</script>
        <script>
            function previewFoto(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.getElementById('previewAvatar').src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            }
        </script>


</body>

</html>
