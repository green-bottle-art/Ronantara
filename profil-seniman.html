        <!-- Kartu identitas seniman -->
        <div class="profil-header-card">
            <div class="profil-avatar-wrap">
                <img id="profilAvatar" class="profil-avatar" src="">

            <div class="profil-info">

            </div>

                <div class="profil-stats">
                    <div class="profil-stat">
                        <b id="statKarya">0</b>

                    </div>
                    <div class="profil-stat">
                        <b id="statPengikut">0</b>

                    </div>
                    <div class="profil-stat">
                        <b id="statApresiasi">0</b>
                        <span>Apresiasi</span>
                    </div>
                </div>
            </div>

            <div class="profil-actions">
                <button type="button" class="btn-follow-lg" id="btnFollowProfil" onclick="toggleFollowProfil(this)">Ikuti</button>
            </div>
        </div>

        <!-- Tab filter kategori -->
        <div class="profil-tabs" id="profilTabs">
            <button type="button" class="profil-tab aktif" data-kategori="Semua" onclick="filterKategori(this)">Semua</button>

        <!-- Grid karya milik seniman -->

            16: { judul: "Would I be Free?", kategori: "Digital Art", pembuat: "Armin",

                gambar: "https://i.pinimg.com/736x/cc/8e/7f/cc8e7fb4dd8e0d58e6fd76569e21568f.jpg", suka: 10 },
            17: { judul: "Alley Cat", kategori: "Fotografi", pembuat: "Gingitsune",
                avatarPembuat: "https://i.pinimg.com/736x/41/98/cd/4198cdee2624fedffba41f5df5674f05.jpg",
                gambar: "https://i.pinimg.com/736x/59/69/b7/5969b738e24c7bb106a9d683ca3c4f98.jpg", suka: 10 },
            18: { judul: "Light", kategori: "Fotografi", pembuat: "Gingitsune",
                avatarPembuat: "https://i.pinimg.com/736x/41/98/cd/4198cdee2624fedffba41f5df5674f05.jpg",
                gambar: "https://i.pinimg.com/736x/2e/cd/53/2ecd53decc640a924a326229cd8fcce4.jpg", suka: 10 },
            19: { judul: "Europe Woman", kategori: "Digital Art", pembuat: "Nana",
                avatarPembuat: "https://i.pinimg.com/1200x/f8/1e/c9/f81ec93e7799c320dac416fafe61c2cf.jpg",
                gambar: "https://i.pinimg.com/736x/21/d9/8e/21d98ec002204d8225d95db45b1a84d0.jpg", suka: 10 }
        };

        // ===== BIO & PENGIKUT PER SENIMAN =====
        const senimanData = {
            "TillTheEnd": { bio: "Fotografer yang jatuh cinta sama komposisi simetris dan ketenangan visual.", pengikut: 842 },
            "Sleepy-C": { bio: "Digital artist, banyak gambar karakter webtoon dengan pencahayaan dramatis.", pengikut: 2310 },
            "Coer": { bio: "Desainer grafis, eksplorasi tipografi dan warna berani jadi ciri khas.", pengikut: 567 },
            "Van Gogh": { bio: "Pelukis pasca-impresionis, dikenal lewat sapuan kuas ekspresif dan warna yang hidup.", pengikut: 15200 },
            "Go Rani": { bio: "Suka main warna pastel dan tekstur playful di setiap karya digital.", pengikut: 1420 },
            "WaelRachedi": { bio: "Desainer poster, fokus ke layout tegas dan hierarki visual yang kuat.", pengikut: 733 },
            "Gingitsune": { bio: "Fotografer candid, suka menangkap momen kecil dari hewan dan cahaya sehari-hari.", pengikut: 998 },
            "Jean": { bio: "Pelukis bergaya Rococo, menghadirkan keceriaan lewat warna cerah dan komposisi dinamis.", pengikut: 4210 },
            "John_Millais": { bio: "Pelukis realis, detail alam jadi kekuatan utama di setiap karyanya.", pengikut: 3105 },
            "Mega_P": { bio: "Fotografer jalanan, suka suasana kota selepas hujan.", pengikut: 654 },
            "Dave_B": { bio: "Desainer grafis dengan gaya retro, terinspirasi arsitektur kota-kota dunia.", pengikut: 1187 },
            "Yoshiki": { bio: "Digital artist & desainer, suka main pencahayaan lembut dan komposisi minimalis.", pengikut: 1890 },
            "neptune_hi": { bio: "Ilustrator karakter fantasi, detail kostum jadi kekuatan tiap karyanya.", pengikut: 2760 },
            "Martin Studio": { bio: "Studio desain visual, sering eksplorasi tema laut dan gradasi warna dalam.", pengikut: 940 },
            "Armin": { bio: "Ilustrator reflektif, banyak karya bertema kebebasan dan simbolisme.", pengikut: 1332 },
            "Nana": { bio: "Digital artist bergaya klasik Eropa dengan sentuhan warna modern.", pengikut: 1560 }
        };

        // ===== BACA NAMA SENIMAN DARI URL =====
        const params = new URLSearchParams(window.location.search);
        const namaSeniman = params.get('nama') || 'Go Rani';

        // Ambil semua karya milik seniman ini
        const semuaKarya = Object.entries(karyaData).map(([id, k]) => ({ id, ...k }));
        const karyaSeniman = semuaKarya.filter(k => k.pembuat === namaSeniman);

        const info = senimanData[namaSeniman] || { bio: "Seniman di Ronantara. Belum ada bio yang ditambahkan.", pengikut: 0 };
        const avatarSeniman = karyaSeniman[0]
            ? karyaSeniman[0].avatarPembuat
            : "https://i.pinimg.com/736x/ec/1b/1e/ec1b1e453ce29b300812a379e14f7a30.jpg";

        // ===== ISI KARTU IDENTITAS =====
        document.getElementById('profilAvatar').src = avatarSeniman;
        document.getElementById('profilNama').textContent = namaSeniman;
        document.getElementById('profilUsername').textContent = '@' + namaSeniman.toLowerCase().replace(/\s+/g, '');
        document.getElementById('profilBio').textContent = info.bio;
        document.getElementById('statKarya').textContent = karyaSeniman.length;
        document.getElementById('statPengikut').textContent = info.pengikut.toLocaleString('id-ID');

        const totalApresiasi = karyaSeniman.reduce((total, k) => total + (k.suka || 0), 0);
        document.getElementById('statApresiasi').textContent = totalApresiasi;

        // ===== TAB KATEGORI DINAMIS =====
        const kategoriUnik = [...new Set(karyaSeniman.map(k => k.kategori))];
        const tabWrap = document.getElementById('profilTabs');
        kategoriUnik.forEach(kat => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'profil-tab';
            btn.dataset.kategori = kat;
            btn.textContent = kat;
            btn.onclick = () => filterKategori(btn);
            tabWrap.appendChild(btn);
        });

        // ===== RENDER GRID KARYA =====
        const grid = document.getElementById('profilGrid');

        function renderGrid(kategori) {
            grid.innerHTML = '';
            const daftar = kategori === 'Semua'
                ? karyaSeniman
                : karyaSeniman.filter(k => k.kategori === kategori);

            if (daftar.length === 0) {
                grid.innerHTML = '<div class="profil-kosong">Belum ada karya di kategori ini.</div>';
                return;
            }

            daftar.forEach(k => {
                const kartu = document.createElement('a');
                kartu.href = `detail-karya.html?id=${k.id}`;
                kartu.className = 'profil-kartu';
                kartu.innerHTML = `
                    <div class="profil-kartu-gambar">
                        <img src="${k.gambar}" alt="${k.judul}">
                    </div>
                    <div class="profil-kartu-body">
                        <p class="profil-kartu-judul">${k.judul}</p>
                        <div class="profil-kartu-meta">
                            <span>${k.kategori}</span>
                            <span>♥ ${k.suka}</span>
                        </div>
                    </div>`;
                grid.appendChild(kartu);
            });
        }

        renderGrid('Semua');

        function filterKategori(btn) {
            document.querySelectorAll('.profil-tab').forEach(t => t.classList.remove('aktif'));
            btn.classList.add('aktif');
            renderGrid(btn.dataset.kategori);
        }

        function toggleFollowProfil(btn) {
            const statPengikut = document.getElementById('statPengikut');
            let jumlah = parseInt(statPengikut.textContent.replace(/\./g, ''), 10);

            if (btn.textContent.trim() === 'Ikuti') {
                btn.textContent = 'Mengikuti';
                btn.classList.add('mengikuti');
                jumlah += 1;
            } else {
                btn.textContent = 'Ikuti';
                btn.classList.remove('mengikuti');
                jumlah -= 1;
            }
            statPengikut.textContent = jumlah.toLocaleString('id-ID');
        }
    </script>
</body>

</html>
