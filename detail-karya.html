                19: { judul: "Europe Woman", kategori: "Digital Art", pembuat: "Nana",
                    avatarPembuat: "https://i.pinimg.com/1200x/f8/1e/c9/f81ec93e7799c320dac416fafe61c2cf.jpg",
                    gambar: "https://i.pinimg.com/736x/21/d9/8e/21d98ec002204d8225d95db45b1a84d0.jpg",
                    deskripsi: "Potret digital bergaya klasik Eropa, memadukan detail busana era lampau dengan sentuhan warna modern.",
                    suka: 10,
                    komentar: [
                        { avatar: "https://i.pinimg.com/1200x/9a/29/bd/9a29bd5c341c193cfd1248cd78db4c70.jpg", teks: "Detail busananya autentik banget" },
                        { avatar: "https://i.pinimg.com/736x/fa/f8/d9/faf8d9c3bef649426220b27b0195f569.jpg", teks: "Perpaduan klasik modernnya smooth" }
                    ]}
            };

            // ===== BACA ID DARI URL, TAMPILKAN DATANYA =====
            const params = new URLSearchParams(window.location.search);
            const idKarya = params.get('id') || '1';
            const data = karyaData[idKarya] || karyaData['1'];

            document.getElementById('detailGambar').src = data.gambar;
            document.getElementById('detailKategori').textContent = data.kategori;
            document.getElementById('detailJudul').textContent = data.judul;
            document.getElementById('detailNamaPembuat').textContent = data.pembuat;
            document.getElementById('detailAvatarPembuat').src = data.avatarPembuat;
            document.getElementById('detailDeskripsi').textContent = data.deskripsi;
            document.getElementById('jumlahSuka').textContent = data.suka;

            // Arahkan avatar & nama pembuat ke halaman profil seniman yang sesuai
            const urlProfilSeniman = `profil-seniman.html?nama=${encodeURIComponent(data.pembuat)}`;
            document.getElementById('linkPembuat').href = urlProfilSeniman;
            document.getElementById('linkPembuatNama').href = urlProfilSeniman;

            const daftarKomentar = document.getElementById('daftarKomentar');
            data.komentar.forEach(k => {
                const item = document.createElement('div');
                item.className = 'komentar-item';
                item.innerHTML = `<img src="${k.avatar}" class="rounded-circle avatar-circle">
                    <div class="komentar-bubble"></div>`;
                item.querySelector('.komentar-bubble').textContent = k.teks;
                daftarKomentar.appendChild(item);
            });
            document.getElementById('komentarHeader').textContent = `Komentar (${data.komentar.length})`;

            // ===== FUNGSI-FUNGSI INTERAKSI (sama seperti sebelumnya) =====
            function toggleSuka(btn) {
                const jumlah = document.getElementById('jumlahSuka');
                const label = document.getElementById('labelSuka');
                let nilai = parseInt(jumlah.textContent, 10);

                if (btn.classList.contains('liked')) {
                    btn.classList.remove('liked');
                    label.textContent = 'Apresiasi';
                    nilai -= 1;
                } else {
                    btn.classList.add('liked');
                    label.textContent = 'Diapresiasi';
                    nilai += 1;
                }
                jumlah.textContent = nilai;
            }

            function toggleFollow(btn) {
                if (btn.textContent.trim() === 'Ikuti') {
                    btn.textContent = 'Mengikuti';
                } else {
                    btn.textContent = 'Ikuti';
                }
            }

            function tambahKomentar(e) {
                e.preventDefault();
                const input = document.getElementById('inputKomentar');
                const teks = input.value.trim();
                if (teks === '') return;

                const daftar = document.getElementById('daftarKomentar');
                const item = document.createElement('div');
                item.className = 'komentar-item';
                item.innerHTML = `
                <img src="https://i.pinimg.com/736x/ad/cb/ed/adcbed4eca9b815328f3585d547c5d76.jpg" class="rounded-circle avatar-circle">
                <div class="komentar-bubble"></div>`;
                item.querySelector('.komentar-bubble').textContent = teks;
                daftar.appendChild(item);
                daftar.scrollTop = daftar.scrollHeight;

                const header = document.getElementById('komentarHeader');
                const match = header.textContent.match(/\d+/);
                const jumlahBaru = (match ? parseInt(match[0], 10) : 0) + 1;
                header.textContent = `Komentar (${jumlahBaru})`;

                input.value = '';
            }
        </script>
</body>
